<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💖</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html, body{
    width:100%;
    height:100%;
}

body{
    background-image:url("flores.jpeg");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.mensagem{
    background:rgba(255,255,255,0.35);
    padding:30px;
    border-radius:20px;
    backdrop-filter:blur(3px);
}

h1{
    font-size:60px;
    color:#d63384;
    text-shadow:2px 2px 4px rgba(0,0,0,0.2);
}

p{
    margin-top:15px;
    font-size:38px;
    color:#333;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="mensagem">
    <h1>Oiii Linda !!! 💖</h1>
    <p>O vencimento do Cartão é dia 15 😂!!</p>
</div>

</body>
</html>
